<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Movimientos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <link href="../css/vendor.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/panelPrincipal.css">
  <link rel="stylesheet" href="../css/registro.css">
</head>
<body>
  <aside class="app-sidebar" aria-label="Navegación principal">
    <div class="sidebar-brand"><span class="brand-mark">S</span><span>SIPRO</span></div>
    <nav class="sidebar-nav"><a class="sidebar-link" href="panelPrincipal.html"><i data-lucide="layout-dashboard"></i> Dashboard</a><a class="sidebar-link" href="productos.html"><i data-lucide="package"></i> Productos</a><a class="sidebar-link" href="usuarios.html"><i data-lucide="users"></i> Usuarios</a><a class="sidebar-link active" href="registro.html"><i data-lucide="arrow-left-right"></i> Movimientos</a></nav>
  </aside>
  <div class="dashboard-card">
    <!-- Filtros -->
    <div class="row mb-3 align-items-end g-3 filtro-container">
      <div class="col-md-4 col-sm-12">
        <label for="filtro" class="form-label">Buscar</label>
        <input type="search" id="filtro" class="form-control" placeholder="Producto o tipo de movimiento...">
      </div>

      <div class="col-md-3 col-sm-6">
        <label for="filtroCategoria" class="form-label">Categoría</label>
        <select id="filtroCategoria" class="form-select">
          <option value="">Todas las categorías</option>
        </select>
      </div>
      <div class="col-md-3 col-sm-6">
        <label for="filtroProducto" class="form-label">Producto</label>
        <select id="filtroProducto" class="form-select"><option value="">Todos los productos</option></select>
      </div>
      <div class="col-md-2 col-sm-6">
        <label for="filtroTipo" class="form-label">Tipo</label>
        <select id="filtroTipo" class="form-select"><option value="">Todos</option><option value="entrada">Entrada</option><option value="salida">Salida</option></select>
      </div>

      <div class="col-md-2 col-sm-6">
        <label for="fechaInicio" class="form-label">Fecha inicio</label>
        <input type="date" id="fechaInicio" class="form-control">
      </div>

      <div class="col-md-2 col-sm-6">
        <label for="fechaFin" class="form-label">Fecha fin</label>
        <input type="date" id="fechaFin" class="form-control">
      </div>

      <div class="col-md-auto col-sm-12 export-action">
        <button id="exportMovementsButton" class="btn btn-success btn-lg w-100">
          <i data-lucide="file-spreadsheet" aria-hidden="true"></i> Exportar
        </button>
      </div>
    </div>

    <div class="table-container">
      <table class="table table-striped table-hover" id="tablaMovimientos">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Producto</th>
            <th>Categoria</th>
            <th>Tipo</th>
            <th>Cantidad</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination-bar" aria-label="Paginación de movimientos">
      <span id="paginacionInfo"></span>
      <div><button id="paginaAnterior" class="btn btn-outline-secondary btn-sm"><i data-lucide="chevron-left" aria-hidden="true"></i> Anterior</button><button id="paginaSiguiente" class="btn btn-outline-secondary btn-sm">Siguiente <i data-lucide="chevron-right" aria-hidden="true"></i></button></div>
    </div>
  </div>
  <script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="../js/vendor/bootstrap.js"></script>
  <script src="../helpers/notificaciones.js"></script>
  <script src="../js/registro.js"></script>
</body>
</html>
