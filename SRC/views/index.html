<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <title>Hotel El Silencio del Campo | Sistema de inventario</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link href="../css/vendor.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(rgba(18,58,46,.46), rgba(18,58,46,.46)), url('../assets/fondologin.png') center / cover no-repeat;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      animation: none;
    }
    .login-card {
      background-color: rgba(255,255,255,0.96);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      animation: none;
    }
    .login-card h2 { color: #19483b; font-family: Georgia, serif; }
    .login-card .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 88%;
      margin-right: auto;
      margin-left: auto;
      min-height: 52px;
      border: 0;
      background: #19483b;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .login-card .btn-primary:hover,
    .login-card .btn-primary:focus { background: #123a2e; }
    .form-control::placeholder { color: #aaa; }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 70%;
      transform: translateY(-50%);
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      color: #888;
    }
    .password-toggle:hover, .password-toggle:focus-visible { background:#edf2ef; color:#19483b; outline:2px solid transparent; }
    .password-toggle svg { width:19px; height:19px; }
    .position-relative { position: relative; }
    .login-identity { margin-bottom: 1.5rem; }
    .login-identity img { width: 82px; height: 82px; object-fit: contain; display: block; margin: 0 auto 0.75rem; }
    .login-identity strong, .login-identity span { display: block; }
    .login-identity strong { color: #19483b; font: 600 1.35rem Georgia, serif; }
    .login-identity span { color: #718078; font-size: .8rem; margin-top: .25rem; }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    @keyframes slideIn { from { transform: translateY(-40px); opacity:0 } to { transform: translateY(0); opacity:1 } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center login-identity"><img src="../assets/logo hotel.png" alt="Hotel El Silencio del Campo"><strong>Hotel El Silencio del Campo</strong><span>Sistema de inventario</span></div>
    <h2 class="text-center mb-4">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="correo@admin.com" required />
      </div>
      <div class="mb-3 position-relative">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Contraseña" required style="padding-right:40px;">
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-3"><i data-lucide="log-in" aria-hidden="true"></i> Ingresar</button>
    </form>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastMsg" class="toast text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" hidden>
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="../js/vendor/bootstrap.js"></script>
  <script src="../js/passwordVisibility.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
